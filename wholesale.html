<style>
:root{--navy:#0b1a38;--navy2:#122649;--orange:#ff8c00;--green:#047857;--blue:#1e40af;--purple:#7c3aed;--gold:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f1f2;color:#333;min-height:100vh}

/* ── Login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.login-card{background:#fff;border-radius:16px;padding:32px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:20px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;font-size:12px;color:#6b7280;margin-bottom:24px}
.login-card .lock{text-align:center;font-size:40px;margin-bottom:12px}

/* ── Layout ── */
.ws-layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--navy);color:#fff;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform .3s}
.sidebar .brand{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar .brand img{height:32px;border-radius:8px}
.sidebar .brand span{font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.05em}
.sidebar nav{padding:12px 8px}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;margin-bottom:2px;border:0;background:0;width:100%;text-align:left}
.sidebar .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar .nav-item.active{background:var(--orange);color:#fff;font-weight:700}
.sidebar .nav-item .icon{font-size:16px;width:22px;text-align:center}
.sidebar .nav-section{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);padding:16px 12px 6px}

.main{flex:1;margin-left:240px;padding:0}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.topbar h2{font-size:16px;font-weight:900;color:var(--navy)}
.content{padding:24px}

/* ── Cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e5e7eb}
.stat-card .label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
.stat-card .value{font-size:28px;font-weight:900;color:var(--navy);margin:4px 0}
.stat-card .change{font-size:11px;font-weight:700}.stat-card .change.up{color:var(--green)}.stat-card .change.down{color:#dc2626}

/* ── Table ── */
.table-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;margin-bottom:20px}
.table-card .hd{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.table-card .hd h3{font-size:14px;font-weight:800;color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;border-bottom:1px solid #e5e7eb;background:#f9fafb}
td{padding:10px 14px;font-size:12px;font-weight:600;color:#374151;border-bottom:1px solid #f3f4f6}
tr:hover{background:#f9fafb}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fecaca;color:#991b1b}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-gold{background:#fef3c7;color:#92400e}

/* ── Buttons ── */
.btn{padding:8px 14px;border:0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#e67e00}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#065f46}
.btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#1e3a8a}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:#92400e}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #d1d5db}.btn-outline:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:5px 10px;font-size:10px}

/* ── Forms ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--orange)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Pricing Tiers ── */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.tier-card{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px;text-align:center}
.tier-card .qty{font-size:11px;font-weight:800;color:var(--orange);text-transform:uppercase}
.tier-card .price{font-size:18px;font-weight:900;color:var(--navy);margin:4px 0}
.tier-card .save{font-size:10px;color:var(--green);font-weight:700}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hd{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2;border-radius:16px 16px 0 0}
.modal-hd h3{font-size:15px;font-weight:900;color:var(--navy)}
.modal-hd .close{width:30px;height:30px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-bd{padding:20px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;opacity:0;transform:translateY(20px);transition:all .3s;max-width:340px;border:1px solid rgba(255,140,0,.4)}
.toast.show{opacity:1;transform:translateY(0)}

/* ── Wholesale Price Highlight ── */
.ws-price{color:var(--green);font-weight:900}
.retail-price{color:#9ca3af;text-decoration:line-through;font-weight:600;font-size:11px}
.save-badge{background:#dcfce7;color:#166534;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:4px}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:280px}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .fg-row{grid-template-columns:1fr}
  .content{padding:16px}
  .tier-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

function ld(k,f){try{const s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return f}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}
function fmt(n){return'GH₵ '+Number(n).toLocaleString()}
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

function isLoggedIn(){return!!ld(K_SESSION,null)}
function showDashboard(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('wsDashboard').style.display='';
  const s=ld(K_SESSION,{});
  document.getElementById('dealerName').textContent=s.name||'Dealer';
  loadPage('dashboard');
}

document.getElementById('loginBtn').addEventListener('click',()=>{
  const phone=document.getElementById('wsPhone').value.trim();
  const pass=document.getElementById('wsPass').value;

  if(!VG.canPerform('ws_login',5,900000)){document.getElementById('loginErr').textContent='Too many attempts. Wait 15 minutes.';return}

  // Check wholesale dealers
  const dealers=ld('vg_ws_dealers',[]);
  const dealer=dealers.find(d=>d.phone===phone&&d.pass===pass);
  if(!dealer){document.getElementById('loginErr').textContent='Invalid credentials or not approved for wholesale.';return}
  if(dealer.status!=='approved'){document.getElementById('loginErr').textContent='Your wholesale account is pending approval.';return}

  sv(K_SESSION,{id:dealer.id,name:dealer.name,phone:dealer.phone,business:dealer.business});
  showDashboard();
  VG.audit('WS_LOGIN',{dealer:dealer.name});
});

document.getElementById('logoutBtn').addEventListener('click',()=>{
  localStorage.removeItem(K_SESSION);
  document.getElementById('wsDashboard').style.display='none';
  document.getElementById('loginScreen').style.display='';
  toast('Logged out.');
});

  const p=WHOLESALE_CATALOG.find(x=>x.id===id);

  document.getElementById('oUnitPrice').textContent=fmt(unitPrice);

};

window._updateCalc=function(){
  const sel=document.getElementById('calcProduct');
  const opt=sel.options[sel.selectedIndex];
  const ws=parseInt(opt.dataset.ws);
  const retail=parseInt(opt.dataset.retail);
  const qty=parseInt(document.getElementById('calcQty').value)||1;
  const sell=parseInt(document.getElementById('calcSell').value)||0;
  const cost=ws*qty;
  const revenue=sell*qty;
  const profitUnit=sell-ws;
  const profitTotal=profitUnit*qty;
  const margin=sell>0?Math.round((profitUnit/sell)*100):0;
  document.getElementById('calcCost').textContent=fmt(cost);
  document.getElementById('calcRevenue').textContent=fmt(revenue);
  document.getElementById('calcProfitUnit').textContent=fmt(profitUnit);
  document.getElementById('calcProfitTotal').textContent=fmt(profitTotal);
  document.getElementById('calcMargin').textContent=margin+'%';
};
