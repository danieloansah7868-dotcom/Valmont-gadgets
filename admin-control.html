<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Valmont Admin — Control Panel</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="X-XSS-Protection" content="1; mode=block">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="tailwind.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="assets/js/security.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/db-adapter.js"></script>
<style>
:root{--navy:#0b1a38;--navy2:#122649;--orange:#ff8c00;--green:#047857;--red:#dc2626;--blue:#1e40af;--purple:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f1f1f2;color:#333;min-height:100vh}

/* ── Login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,var(--navy),var(--navy2))}
.login-card{background:#fff;border-radius:16px;padding:32px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:20px;font-weight:900;color:var(--navy);text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;font-size:12px;color:#6b7280;margin-bottom:24px}
.login-card .lock{text-align:center;font-size:40px;margin-bottom:12px}

/* ── Layout ── */
.admin-layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--navy);color:#fff;padding:0;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:50;transition:transform .3s}
.sidebar .brand{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.sidebar .brand img{height:32px}
.sidebar .brand span{font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.05em}
.sidebar nav{padding:12px 8px}
.sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;margin-bottom:2px;border:0;background:0;width:100%;text-align:left}
.sidebar .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar .nav-item.active{background:var(--orange);color:#fff;font-weight:700}
.sidebar .nav-item .icon{font-size:16px;width:22px;text-align:center}
.sidebar .nav-section{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.35);padding:16px 12px 6px}

.main{flex:1;margin-left:240px;padding:0}
.topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.topbar h2{font-size:16px;font-weight:900;color:var(--navy)}
.topbar .right{display:flex;gap:10px;align-items:center}
.content{padding:24px}

/* ── Cards ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:12px;padding:18px;border:1px solid #e5e7eb}
.stat-card .label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em}
.stat-card .value{font-size:28px;font-weight:900;color:var(--navy);margin:4px 0}
.stat-card .change{font-size:11px;font-weight:700}
.stat-card .change.up{color:var(--green)}.stat-card .change.down{color:var(--red)}

/* ── Table ── */
.table-card{background:#fff;border-radius:12px;border:1px solid #e5e7eb;overflow:hidden;margin-bottom:20px}
.table-card .hd{padding:16px 18px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}
.table-card .hd h3{font-size:14px;font-weight:800;color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#6b7280;border-bottom:1px solid #e5e7eb;background:#f9fafb}
td{padding:10px 14px;font-size:12px;font-weight:600;color:#374151;border-bottom:1px solid #f3f4f6}
tr:hover{background:#f9fafb}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fecaca;color:#991b1b}
.badge-yellow{background:#fef9c3;color:#854d0e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-gray{background:#f3f4f6;color:#374151}
.badge-orange{background:#fff7ed;color:#9a3412}

/* ── Buttons ── */
.btn{padding:8px 14px;border:0;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#e67e00}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#065f46}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#b91c1c}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#1e3a8a}
.btn-outline{background:#fff;color:#374151;border:1.5px solid #d1d5db}.btn-outline:hover{border-color:var(--orange);color:var(--orange)}
.btn-sm{padding:5px 10px;font-size:10px}

/* ── Forms ── */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--orange)}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-hd{padding:16px 20px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2;border-radius:16px 16px 0 0}
.modal-hd h3{font-size:15px;font-weight:900;color:var(--navy)}
.modal-hd .close{width:30px;height:30px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-bd{padding:20px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:14px 20px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:200;opacity:0;transform:translateY(20px);transition:all .3s;max-width:340px;border:1px solid rgba(255,140,0,.4)}
.toast.show{opacity:1;transform:translateY(0)}

/* ── Responsive ── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:280px}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .fg-row{grid-template-columns:1fr}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  table{font-size:11px}th,td{padding:8px 10px}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════ -->
<!-- LOGIN SCREEN -->
<!-- ══════════════════════════════════════════ -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="lock">🔐</div>
    <h1>Valmont Admin</h1>
    <p class="sub">Secure control panel — authorized access only</p>
    <div class="fg"><label>Admin Username</label><input id="adminUser" type="text" placeholder="admin" autocomplete="username"></div>
    <div class="fg"><label>Password</label><input id="adminPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <p id="loginErr" style="color:var(--red);font-size:12px;font-weight:700;min-height:18px;margin-bottom:10px"></p>
    <button class="btn btn-primary" style="width:100%;padding:12px;font-size:13px" id="loginBtn">Sign In to Admin</button>
    <p style="font-size:10px;color:#9ca3af;text-align:center;margin-top:12px">Protected area • All actions are logged</p>
  </div>
</div>

<!-- ══════════════════════════════════════════ -->
<!-- ADMIN DASHBOARD -->
<!-- ══════════════════════════════════════════ -->
<div id="adminDashboard" class="admin-layout" style="display:none">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="favicon.png" alt="V" style="border-radius:8px">
      <span>VALMONT ADMIN</span>
    </div>
    <nav>
      <div class="nav-section">Overview</div>
      <button class="nav-item active" data-page="dashboard"><span class="icon">📊</span> Dashboard</button>
      <button class="nav-item" data-page="orders"><span class="icon">📦</span> Orders</button>

      <div class="nav-section">Inventory</div>
      <button class="nav-item" data-page="products"><span class="icon">📱</span> Products</button>
      <button class="nav-item" data-page="used"><span class="icon">🌍</span> UK/US Used</button>
      <button class="nav-item" data-page="swap"><span class="icon">🔄</span> Swap Listings</button>

      <div class="nav-section">Users</div>
      <button class="nav-item" data-page="users"><span class="icon">👥</span> All Users</button>
      <button class="nav-item" data-page="dealers"><span class="icon">🏪</span> Dealers</button>
      <button class="nav-item" data-page="sellers"><span class="icon">💰</span> Sellers</button>

      <div class="nav-section">Revenue</div>
      <button class="nav-item" data-page="ads"><span class="icon">⭐</span> Ad Revenue</button>
      <button class="nav-item" data-page="payments"><span class="icon">💳</span> Payments</button>

      <div class="nav-section">System</div>
      <button class="nav-item" data-page="settings"><span class="icon">⚙️</span> Settings</button>
      <button class="nav-item" data-page="logs"><span class="icon">📋</span> Activity Logs</button>
      <button class="nav-item" id="logoutAdmin" style="color:#f87171"><span class="icon">🚪</span> Logout</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <!-- Topbar -->
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button id="menuToggle" style="display:none;background:0;border:0;font-size:20px;cursor:pointer">☰</button>
        <h2 id="pageTitle">Dashboard</h2>
      </div>
      <div class="right">
        <span style="font-size:11px;color:#6b7280;font-weight:600" id="adminName">Admin</span>
        <a href="/" class="btn btn-outline btn-sm" target="_blank">View Site</a>
      </div>
    </div>

    <!-- Content Area -->
    <div class="content" id="pageContent">
      <!-- Pages loaded dynamically -->
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span id="toastMsg">Done!</span></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-hd"><h3 id="modalTitle">Modal</h3><button class="close" id="closeModal">×</button></div>
    <div class="modal-bd" id="modalBody"></div>
  </div>
</div>

<script>
(function(){
'use strict';

// ══════════════════════════════════════════
// ADMIN CREDENTIALS (change these!)
// ══════════════════════════════════════════
const ADMIN_USER='admin';
// Password verified via SHA-256 hash — never stored in plain text
async function hashStr(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
// Pre-computed hash for default password — change via Settings page
let ADMIN_PASS_HASH=localStorage.getItem('vg_admin_pass_hash')||null;
// Default password 'valmont2026' — hash computed on first login
const DEFAULT_HASH_PROMISE=hashStr('valmont2026');
const K_SESSION='vg_admin_session';

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
function ld(k,f){try{const s=localStorage.getItem(k);if(s)return JSON.parse(s)}catch(e){}return f}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}
function fmt(n){return'GH\u20B5 '+Number(n).toLocaleString()}
function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function timeAgo(d){const h=Math.floor((Date.now()-new Date(d).getTime())/3600000);if(h<1)return'Just now';if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}

// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
function isLoggedIn(){
  const s=VG.session.get(K_SESSION);
  return!!s;
}
function showAdmin(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminDashboard').style.display='';
  loadPage('dashboard');
}

document.getElementById('loginBtn').addEventListener('click',async()=>{
  const u=document.getElementById('adminUser').value.trim();
  const p=document.getElementById('adminPass').value;

  // Rate limit via security module
  if(!VG.canPerform('admin_login',3,900000)){
    document.getElementById('loginErr').textContent='Too many attempts. Wait 15 minutes.';
    VG.audit('ADMIN_LOGIN_LOCKED',{user:u});
    return;
  }

  if(u!==ADMIN_USER){document.getElementById('loginErr').textContent='Invalid credentials.';VG.audit('ADMIN_LOGIN_FAIL',{user:u,reason:'bad_user'});return}

  // Hash the entered password and compare
  const enteredHash=await hashStr(p);
  const defaultHash=await DEFAULT_HASH_PROMISE;
  const storedHash=ADMIN_PASS_HASH||defaultHash;

  if(enteredHash!==storedHash){
    document.getElementById('loginErr').textContent='Invalid credentials.';
    VG.audit('ADMIN_LOGIN_FAIL',{user:u,reason:'bad_pass'});
    return;
  }

  VG.session.create(K_SESSION,{user:u},7200000);
  showAdmin();
  VG.audit('ADMIN_LOGIN_SUCCESS',{user:u});
});

document.getElementById('logoutAdmin').addEventListener('click',()=>{
  localStorage.removeItem(K_SESSION);
  document.getElementById('adminDashboard').style.display='none';
  document.getElementById('loginScreen').style.display='';
  toast('Logged out.');
});

if(isLoggedIn())showAdmin();

// ══════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════
let currentPage='dashboard';
document.querySelectorAll('.nav-item[data-page]').forEach(n=>{
  n.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(nn=>nn.classList.remove('active'));
    n.classList.add('active');
    currentPage=n.dataset.page;
    document.getElementById('pageTitle').textContent=n.textContent.trim();
    loadPage(currentPage);
    // Close mobile sidebar
    document.getElementById('sidebar').classList.remove('open');
  });
});

// Mobile menu
const menuToggle=document.getElementById('menuToggle');
if(window.innerWidth<=768)menuToggle.style.display='';
menuToggle.addEventListener('click',()=>{document.getElementById('sidebar').classList.toggle('open')});

// Modal
document.getElementById('closeModal').addEventListener('click',()=>{document.getElementById('modal').classList.remove('open')});

// ══════════════════════════════════════════
// ACTIVITY LOG
// ══════════════════════════════════════════
function logActivity(action){
  const logs=ld('vg_admin_logs',[]);
  logs.unshift({action,time:new Date().toISOString()});
  if(logs.length>200)logs.length=200;
  sv('vg_admin_logs',logs);
}

// ══════════════════════════════════════════
// PAGE RENDERERS
// ══════════════════════════════════════════
function loadPage(page){
  const c=document.getElementById('pageContent');
  const renderers={dashboard:renderDashboard,products:renderProducts,used:renderUsed,swap:renderSwap,orders:renderOrders,users:renderUsers,dealers:renderDealers,sellers:renderSellers,ads:renderAds,payments:renderPayments,settings:renderSettings,logs:renderLogs};
  if(renderers[page])renderers[page](c);
}

// ── DASHBOARD ──
async function renderDashboard(c){
  const products=window.VDBUsed ? await VDBUsed.getAll() : ld('vg_used_inventory',[]);
  const swapListings=window.VDBSwap ? await VDBSwap.getAllIncludingPending() : ld('vg_swap_listings',[]);
  const users=window.VDBUser ? await VDBUser.getAll() : ld('vg_swap_users',[]);
  const leads=window.VDBSwap ? await VDBSwap.getLeads() : ld('vg_swap_leads',[]);
  const orders=ld('vg_orders',[]);
  const ads=swapListings.filter(l=>l.promoted);
  const totalRevenue=ld('vg_ad_revenue',0);

  c.innerHTML=`
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Total Products</div><div class="value">${products.length}</div><div class="change up">In catalog</div></div>
      <div class="stat-card"><div class="label">Swap Listings</div><div class="value">${swapListings.filter(l=>l.status==='active').length}</div><div class="change up">${swapListings.filter(l=>l.status==='pending').length} pending</div></div>
      <div class="stat-card"><div class="label">Registered Users</div><div class="value">${users.length}</div><div class="change up">Verified sellers</div></div>
      <div class="stat-card"><div class="label">Total Leads</div><div class="value">${leads.length}</div><div class="change up">${leads.filter(l=>l.status==='new').length} new</div></div>
      <div class="stat-card"><div class="label">Active Ads</div><div class="value">${ads.length}</div><div class="change up">Promoted listings</div></div>
      <div class="stat-card"><div class="label">Ad Revenue</div><div class="value">${fmt(totalRevenue)}</div><div class="change up">Total earned</div></div>
      <div class="stat-card"><div class="label">Orders</div><div class="value">${orders.length}</div><div class="change up">${orders.filter(o=>o.status==='pending').length} pending</div></div>
      <div class="stat-card"><div class="label">Sold Items</div><div class="value">${products.filter(p=>p.sold).length}</div><div class="change down">UK/US Used</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="table-card">
        <div class="hd"><h3>Recent Activity</h3></div>
        <table><thead><tr><th>Action</th><th>Time</th></tr></thead>
        <tbody>${(ld('vg_admin_logs',[])).slice(0,10).map(l=>`<tr><td>${l.action}</td><td>${timeAgo(l.time)}</td></tr>`).join('')||'<tr><td colspan="2" style="text-align:center;color:#9ca3af">No activity yet</td></tr>'}</tbody></table>
      </div>
      <div class="table-card">
        <div class="hd"><h3>Pending Approvals</h3></div>
        <table><thead><tr><th>Listing</th><th>Seller</th><th>Action</th></tr></thead>
        <tbody>${swapListings.filter(l=>l.status==='pending').slice(0,5).map(l=>`<tr><td>${l.model}</td><td>${l.userName}</td><td><button class="btn btn-green btn-sm" onclick="window._approve('${l.id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="window._reject('${l.id}')">Reject</button></td></tr>`).join('')||'<tr><td colspan="3" style="text-align:center;color:#9ca3af">Nothing pending</td></tr>'}</tbody></table>
      </div>
    </div>`;
}

// ── PRODUCTS ──
async function renderProducts(c){
  const products=window.VDBUsed ? await VDBUsed.getAll() : ld('vg_used_inventory',[]);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:16px;font-weight:900;color:var(--navy)">UK/US Used Inventory</h3>
      <button class="btn btn-primary" onclick="window._addProduct()">+ Add Phone</button>
    </div>
    <div class="table-card">
      <table><thead><tr><th>Phone</th><th>Origin</th><th>Storage</th><th>Grade</th><th>Battery</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>${products.map(p=>`<tr>
        <td><strong>${p.name}</strong><br><span style="font-size:10px;color:#9ca3af">${p.color||''}</span></td>
        <td><span class="badge ${p.origin==='uk'?'badge-blue':'badge-green'}">${p.origin.toUpperCase()}</span></td>
        <td>${p.storage}</td>
        <td><span class="badge ${p.grade==='A'?'badge-green':p.grade==='B'?'badge-blue':'badge-yellow'}">Grade ${p.grade}</span></td>
        <td>${p.battery}%</td>
        <td>${fmt(p.price)}</td>
        <td><span class="badge ${p.sold?'badge-red':'badge-green'}">${p.sold?'SOLD':'Available'}</span></td>
        <td>
          <button class="btn btn-outline btn-sm" onclick="window._toggleSold('${p.id}')">${p.sold?'Restock':'Mark Sold'}</button>
          <button class="btn btn-red btn-sm" onclick="window._deleteProduct('${p.id}')">Delete</button>
        </td>
      </tr>`).join('')}</tbody></table>
    </div>`;
}

window._toggleSold=function(id){
  const products=ld('vg_used_inventory',[]);
  const p=products.find(x=>x.id===id);
  if(p){p.sold=!p.sold;sv('vg_used_inventory',products);toast(p.sold?'Marked as sold':'Restocked');logActivity(`${p.name} ${p.sold?'sold':'restocked'}`);loadPage('products')}
};

window._deleteProduct=function(id){
  if(!confirm('Delete this product?'))return;
  const products=ld('vg_used_inventory',[]).filter(x=>x.id!==id);
  sv('vg_used_inventory',products);toast('Deleted');logActivity('Product deleted');loadPage('products')
};

window._addProduct=function(){
  document.getElementById('modalTitle').textContent='Add New Phone';
  document.getElementById('modalBody').innerHTML=`

window._saveProduct=function(){
  const products=ld('vg_used_inventory',[]);
  const images=document.getElementById('mImages').value.trim().split('\n').filter(x=>x.trim());
  products.unshift({
    id:'p'+Date.now(),origin:document.getElementById('mOrigin').value,brand:document.getElementById('mBrand').value.toLowerCase(),
    name:document.getElementById('mModel').value,storage:document.getElementById('mStorage').value,color:document.getElementById('mColor').value,
    grade:document.getElementById('mGrade').value,battery:parseInt(document.getElementById('mBattery').value),
    price:parseInt(document.getElementById('mPrice').value),was:parseInt(document.getElementById('mWas').value)||null,
    screen:document.getElementById('mScreen').value,body:document.getElementById('mBody').value,
    images:images.length?images:['https://images.unsplash.com/photo-1592750475338-74b7b21085ab?q=80&w=400&auto=format&fit=crop'],
    date:new Date().toISOString().slice(0,10),sold:false
  });
  sv('vg_used_inventory',products);
  document.getElementById('modal').classList.remove('open');
  toast('Phone added!');logActivity('New phone added: '+document.getElementById('mModel').value);loadPage('products');
};

// ── SWAP LISTINGS ──
async function renderSwap(c){
  const listings=window.VDBSwap ? await VDBSwap.getAllIncludingPending() : ld('vg_swap_listings',[]);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:16px;font-weight:900;color:var(--navy)">Swap & Sell Listings</h3>
      <div style="display:flex;gap:8px">
        <span class="badge badge-yellow">${listings.filter(l=>l.status==='pending').length} Pending</span>
        <span class="badge badge-green">${listings.filter(l=>l.status==='active').length} Active</span>
        <span class="badge badge-orange">${listings.filter(l=>l.promoted).length} Promoted</span>
      </div>
    </div>
    <div class="table-card">
      <table><thead><tr><th>Phone</th><th>Seller</th><th>Type</th><th>Price/Want</th><th>Grade</th><th>Status</th><th>Promo</th><th>Actions</th></tr></thead>
      <tbody>${listings.map(l=>`<tr>
        <td><strong>${l.model}</strong><br><span style="font-size:10px;color:#9ca3af">${l.storage} • ${l.color||''}</span></td>
        <td>${l.userName}<br><span style="font-size:10px;color:#9ca3af">${l.userPhone}</span></td>
        <td><span class="badge ${l.type==='swap'?'badge-blue':l.type==='sell'?'badge-green':'badge-purple'}">${l.type}</span></td>
        <td>${l.price?fmt(l.price):'<span style="font-size:10px">'+l.want+'</span>'}</td>
        <td><span class="badge ${l.grade==='A'?'badge-green':l.grade==='B'?'badge-blue':'badge-yellow'}">${l.grade}</span></td>
        <td><span class="badge ${l.status==='active'?'badge-green':l.status==='pending'?'badge-yellow':'badge-red'}">${l.status}</span></td>
        <td>${l.promoted?'<span class="badge badge-orange">⭐ Active</span>':'—'}</td>
        <td>
          ${l.status==='pending'?`<button class="btn btn-green btn-sm" onclick="window._approve('${l.id}')">Approve</button> <button class="btn btn-red btn-sm" onclick="window._reject('${l.id}')">Reject</button>`:
          `<button class="btn btn-outline btn-sm" onclick="window._togglePromo('${l.id}')">${l.promoted?'Unpromo':'Promote'}</button>
           <button class="btn btn-red btn-sm" onclick="window._removeListing('${l.id}')">Remove</button>`}
        </td>
      </tr>`).join('')}</tbody></table>
    </div>`;
}

window._approve=async function(id){
  if(window.VDBSwap)await VDBSwap.approve(id);
  else{const listings=ld('vg_swap_listings',[]);const l=listings.find(x=>x.id===id);if(l){l.status='active';sv('vg_swap_listings',listings);}}
  toast('Approved!');loadPage(currentPage);
};
window._reject=async function(id){
  if(window.VDBSwap)await VDBSwap.reject(id);
  else{const listings=ld('vg_swap_listings',[]);const l=listings.find(x=>x.id===id);if(l){l.status='rejected';sv('vg_swap_listings',listings);}}
  toast('Rejected');loadPage(currentPage);
};
window._togglePromo=function(id){
  const listings=ld('vg_swap_listings',[]);
  const l=listings.find(x=>x.id===id);
  if(l){l.promoted=!l.promoted;sv('vg_swap_listings',listings);toast(l.promoted?'Promoted':'Unpromoted');loadPage(currentPage)}
};
window._removeListing=function(id){
  if(!confirm('Remove this listing?'))return;
  const listings=ld('vg_swap_listings',[]);
  const l=listings.find(x=>x.id===id);
  if(l){l.status='removed';sv('vg_swap_listings',listings);toast('Removed');logActivity('Removed: '+l.model);loadPage(currentPage)}
};

// ── ORDERS ──
async function renderOrders(c){
  const orders=window.VDBWholesale ? await VDBWholesale.getOrders() : ld('vg_orders',[]);

        <td><strong>${o.id}</strong></td>
        <td>${o.customerName}<br><span style="font-size:10px;color:#9ca3af">${o.phone}</span></td>
        <td>${o.items?o.items.length:0} items</td>

        <td>
          <select class="btn btn-outline btn-sm" onchange="window._updateOrder('${o.id}',this.value)" style="padding:5px;font-size:10px">
            <option ${o.status==='pending'?'selected':''}>pending</option>

window._updateOrder=function(id,status){

// ── USERS ──
function renderUsers(c){
  const users=window.VDBUser ? await VDBUser.getAll() : ld('vg_swap_users',[]);
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:16px;font-weight:900;color:var(--navy)">All Users (${users.length})</h3>
    </div>
    <div class="table-card">

      <tbody>${users.map(u=>`<tr>

        <td>${u.facePhoto?`<img src="${u.facePhoto}" style="width:36px;height:36px;object-fit:cover;border-radius:999px;border:2px solid ${u.faceVerified?'var(--green)':'var(--red)'}">`:'<span style="font-size:10px;color:#9ca3af">No selfie</span>'}</td>
        <td><span class="badge ${u.verified?'badge-green':'badge-red'}">${u.verified?'Verified':'Unverified'}</span></td>

          <button class="btn btn-outline btn-sm" onclick="window._toggleVerify('${u.id}')">${u.verified?'Unverify':'Verify'}</button>
          <button class="btn btn-red btn-sm" onclick="window._banUser('${u.id}')">Ban</button>
        </td>
      </tr>`).join('')}</tbody></table>
    </div>`;
}

window._toggleVerify=function(id){
  const users=window.VDBUser ? await VDBUser.getAll() : ld('vg_swap_users',[]);
  const u=users.find(x=>x.id===id);
  if(u){u.verified=!u.verified;sv('vg_swap_users',users);toast(u.verified?'Verified':'Unverified');logActivity('User '+u.name+' '+(u.verified?'verified':'unverified'));loadPage('users')}
};
window._banUser=function(id){
  if(!confirm('Ban this user?'))return;
  const users=ld('vg_swap_users',[]).filter(x=>x.id!==id);
  sv('vg_swap_users',users);toast('User banned');logActivity('User banned');loadPage('users')
};

window._approveDealer=function(id){

// ── SELLERS ──
function renderSellers(c){
  const users=window.VDBUser ? await VDBUser.getAll() : ld('vg_swap_users',[]);
  const listings=ld('vg_swap_listings',[]);
  const sellerStats=users.map(u=>{
    const myListings=listings.filter(l=>l.userId===u.id);
    return{...u,totalListings:myListings.length,active:myListings.filter(l=>l.status==='active').length,sold:myListings.filter(l=>l.status==='sold').length,views:myListings.reduce((s,l)=>s+(l.views||0),0),leads:myListings.reduce((s,l)=>s+(l.leads||0),0)};
  }).filter(u=>u.totalListings>0);

  c.innerHTML=`
    <h3 style="font-size:16px;font-weight:900;color:var(--navy);margin-bottom:16px">Seller Performance</h3>
    <div class="table-card">
      <table><thead><tr><th>Seller</th><th>Phone</th><th>Listings</th><th>Active</th><th>Views</th><th>Leads</th><th>Verified</th></tr></thead>
      <tbody>${sellerStats.map(s=>`<tr>
        <td><strong>${s.name}</strong></td>
        <td>${s.phone}</td>
        <td>${s.totalListings}</td>
        <td>${s.active}</td>
        <td>${s.views}</td>
        <td>${s.leads}</td>
        <td><span class="badge ${s.verified?'badge-green':'badge-red'}">${s.verified?'Yes':'No'}</span></td>
      </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:#9ca3af">No sellers yet</td></tr>'}</tbody></table>
    </div>`;
}
