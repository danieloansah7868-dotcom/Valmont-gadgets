<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="X-XSS-Protection" content="1; mode=block">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://valmontgadgets.com/admin-login.html" />
  <meta name="description" content="Valmont Gadgets admin sign-in.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Valmont Gadgets Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f8fafc;background:#071126}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#172b55 0,#071126 54%)}
    .card{width:min(100%,420px);padding:40px;background:#0f2044;border:1px solid #263b63;border-radius:20px;box-shadow:0 24px 80px #0008}.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:28px}.brand img{width:44px;height:44px}.brand span{font-size:20px;font-weight:800;letter-spacing:.18em;color:#ff8c00}.eyebrow{text-align:center;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:#94a3b8;font-weight:700}.h1{text-align:center;margin:10px 0 8px;font-size:28px}.intro{text-align:center;color:#94a3b8;font-size:14px;margin:0 0 28px;line-height:1.6}label{display:block;font-size:12px;color:#cbd5e1;font-weight:700;margin:17px 0 7px}input{width:100%;padding:14px 15px;border-radius:10px;border:1px solid #3a4d72;background:#071126;color:#fff;font:inherit;font-size:15px;outline:0}input:focus{border-color:#ff8c00;box-shadow:0 0 0 3px #ff8c0024}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#ff8c00;color:#071126;font:inherit;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}.error{min-height:20px;margin:12px 0 0;color:#fca5a5;font-size:13px;font-weight:600}.forgot{display:block;margin-top:20px;text-align:center;color:#fbbf24;font-size:13px;text-decoration:none}.forgot:hover{text-decoration:underline}.note{text-align:center;color:#64748b;font-size:11px;margin:26px 0 0;line-height:1.5}@media(max-width:480px){.card{padding:30px 22px}.h1{font-size:24px}}
    /* Forgot-password / recovery affordances */
    button.forgot{width:auto;margin:20px auto 0;padding:0;background:0 0;border:0;color:#fbbf24;font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:block}
    button.forgot:hover{text-decoration:underline;filter:none}
    button.forgot[disabled]{opacity:.6;cursor:default;text-decoration:none}
    .status{min-height:20px;margin:12px 0 0;color:#86efac;font-size:13px;font-weight:600;text-align:center}
    [hidden]{display:none!important}
  </style>
<script src="assets/js/security.js"></script>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="/logo.svg" alt="Valmont Gadgets" width="32" height="32"></div>
    <div class="eyebrow">Store administration</div>
    <h1 class="h1">Welcome back</h1>
    <p class="intro">Sign in to manage products, orders and your storefront.</p>
    <form id="loginForm" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="you@email.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Sign In</button>
    </form>
    <button type="button" id="forgotBtn" class="forgot">Forgot password?</button>

    <form id="resetForm" hidden novalidate>
      <label for="resetEmail">Send a reset link to</label>
      <input id="resetEmail" name="resetEmail" type="email" autocomplete="username" placeholder="you@email.com" required>
      <p id="resetError" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Send reset link</button>
      <button type="button" id="cancelReset" class="forgot">Back to sign in</button>
    </form>

    <form id="newPasswordForm" hidden novalidate>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter new password" required>
      <p id="newPasswordError" class="error" role="alert" aria-live="polite"></p>
      <button type="submit">Update password</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="note">Authorized Valmont Gadgets staff only.</p>
  </main>
  <script src="assets/js/vendor/supabase-2.112.1.min.js" defer></script>
  <script src="assets/js/admin-login.js" defer></script>
</body>
</html>
